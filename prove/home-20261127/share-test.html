nnello chiuso. Questo non conferma che l’icona sia stata aggiunta.","Non è stato possibile aprire il pannello. Su iPhone usa Condividi dal menu di Safari.","Apri la guida Alfa","Prova separata · ospite fittizio Alfa · camera 1"],"en":["Try on your iPhone","Tap the button. In the panel, look for “Add to Home Screen”. If it is missing, close the panel: this shortcut is not enough.","Open sharing","This browser cannot open sharing from this button. On iPhone, use Safari’s menu: Share → Add to Home Screen.","Panel closed. This does not confirm that the icon was added.","Could not open the panel. On iPhone, use Share in Safari’s menu.","Open Alfa’s guide","Separate test · fictional guest Alfa · room 1"],"de":["Auf deinem iPhone testen","Tippe auf die Schaltfläche. Suche im geöffneten Menü nach „Zum Home-Bildschirm“. Fehlt der Eintrag, schließe das Menü: Diese Abkürzung reicht nicht aus.","Teilen öffnen","Dieser Browser kann das Teilen hier nicht öffnen. Auf dem iPhone: Safari-Menü → Teilen → Zum Home-Bildschirm.","Menü geschlossen. Das bestätigt nicht, dass das Symbol hinzugefügt wurde.","Das Menü konnte nicht geöffnet werden. Nutze auf dem iPhone „Teilen“ im Safari-Menü.","Alfas Reiseführer öffnen","Separater Test · fiktiver Gast Alfa · Zimmer 1"],"fr":["Essai sur ton iPhone","Touche le bouton. Dans le panneau, cherche « Sur l’écran d’accueil ». Si cette option manque, ferme le panneau : ce raccourci ne suffit pas.","Ouvrir le partage","Ce navigateur ne peut pas ouvrir le partage ici. Sur iPhone : menu Safari → Partager → Sur l’écran d’accueil.","Panneau fermé. Cela ne confirme pas l’ajout de l’icône.","Impossible d’ouvrir le panneau. Sur iPhone, utilise Partager dans le menu Safari.","Ouvrir le guide Alfa","Essai séparé · hôte fictif Alfa · chambre 1"],"es":["Prueba en tu iPhone","Pulsa el botón. En el panel busca «Añadir a pantalla de inicio». Si no aparece, cierra el panel: este atajo no basta.","Abrir opciones para compartir","Este navegador no puede abrir el panel el zavři: tato zkratka nestačí.","Otevřít sdílení","Tento prohlížeč neumí otevřít sdílení tímto tlačítkem. Na iPhonu: nabídka Safari → Sdílet → Přidat na plochu.","Panel zavřen. To nepotvrzuje přidání ikony.","Panel nelze otevřít. Na iPhonu použij Sdílet v nabídce Safari.","Otevřít průvodce Alfa","Samostatná zkouška · fiktivní host Alfa · pokoj 1"],"hu":["Próba az iPhone-odon","Koppints a gombra. A panelen keresd a „Főképernyőhöz adás” lehetőséget. Ha hiányzik, zárd be a panelt: ez a rövidítés nem elég.","Megosztás megnyitása","Ez a böngésző nem tudja innen megnyitni a megosztást. iPhone-on: Safari menü → Megosztás → Főképernyőhöz adás.","Panel bezárva. Ez nem igazolja az ikon hozzáadását.","A panel nem nyitható meg. iPhone-on használd a Safari menü Megosztás lehetőségét.","Alfa útmutatójának megnyitása","Külön próba · kitalált vendég: Alfa · 1. szoba"],"bg":["Проба на твоя iPhone","Натисни бутона. В панела потърси „Добави към Начален екран“. Ако липсва, затвори панела: този пряк път не е достатъчен.","Отвори споделянето","Този браузър не може да отвори споделянето от този бутон. На iPhone: меню Safari → Сподели → Добави към Начален екран.","Панелът е затворен. Това не потвърждава, че иконата е добавена.","Панелът не може да се отвори. На iPhone използвай Сподели от менюто на Safari.","Отвори ръководството на Alfa","Отделна проба · измислен гост Alfa · стая 1"],"ja":["iPhoneでテスト","ボタンをタップし、開いたメニューで「ホーム画面に追加」を探してください。項目がなければメニューを閉じてください。この方法だけでは追加できません。","共有メニューを開く","このブラウザでは、このボタンから共有できません。iPhoneではSafariのメニューから「共有」→「ホーム画面に追加」を選んでください。","メニューを閉じました。アイコンが追加されたことを示すものではありません。","メニューを開けませんでした。iPhoneではSafariのメニューから「共有」を選んでください。","Alfaのガイドを開く","独立したテスト · 架空のゲストAlfa · 客室1"]};const selector=document.getElementById('language');const button=document.getElementById('share');const status=document.getElementById('status');const guide=document.getElementById('guide');const target=new URL('alfa/index.html#nome=Ospite%20Prova%20Alfa&camera=1&lingua=it&persone=2&prova=1',location.hr
